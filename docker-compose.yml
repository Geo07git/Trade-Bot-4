services:
  tradebot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gs-tradebot
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      # Persistent storage for state files and trading snapshots
      - ./bot_state.json:/app/bot_state.json
      - ./server/data:/app/server/data
      - ./.env:/app/.env:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
